<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Invitation d'anniversaire</title>

    <!-- SEO / social preview. The server rewrites the <title> and replaces the
         placeholder below with the requested event's metadata before serving
         this shell (see server/src/seo.ts) — link scrapers and crawlers never
         run the app's JavaScript, so the tags must already be in the HTML.
         The defaults here are what `vite dev` and a static preview show. -->
    <!--seo-->
    <meta name="description" content="Invitation d'anniversaire en ligne : date, lieu, thème et réponse (RSVP) en un clic." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Invitation d'anniversaire" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:title" content="Invitation d'anniversaire" />
    <meta property="og:description" content="Invitation d'anniversaire en ligne : date, lieu, thème et réponse (RSVP) en un clic." />
    <meta name="twitter:card" content="summary" />
    <!--/seo-->

    <meta name="theme-color" content="#7B5BFF" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Display + body fonts used by the selectable themes (see src/themes.js). -->
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Bangers&family=Dancing+Script:wght@400;600;700&family=Nunito:wght@400;500;600;700&family=Orbitron:wght@500;700&family=Pacifico&family=Poppins:wght@300;400;500;600&family=Quicksand:wght@400;500;600;700&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <!-- Runtime environment variables (injected by infra/inject-env.sh in the container) -->
    <script src="/env.js"></script>
    <!-- Umami — mesure d'audience auto-hébergée, sans cookie. Page publique d'invitation. -->
    <script defer src="https://umami.battistella.ovh/stats.js"
      data-website-id="b783d281-9c26-4c77-b3ad-3f2c5f10e740"></script>

    <!-- Heatmaps. Script distinct du tracker : `stats.js` ne l'embarque pas.
         `replayEnabled` est OFF côté serveur, donc la charge utile ne contient
         que des coordonnées de clic et de scroll — aucun DOM, aucun texte. -->
    <script defer src="https://umami.battistella.ovh/recorder.js"
      data-website-id="b783d281-9c26-4c77-b3ad-3f2c5f10e740"></script>
</head>

<body>
    <div id="app"></div>
    <noscript>
        Cette invitation a besoin de JavaScript pour s'afficher. Active-le dans ton navigateur,
        ou demande les détails de la fête à la personne qui t'a envoyé le lien.
    </noscript>
    <script type="module" src="/src/main.js"></script>
</body>

</html>
